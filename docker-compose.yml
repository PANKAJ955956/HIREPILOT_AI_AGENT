services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hirepilot
      POSTGRES_USER: hirepilot
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirepilot -d hirepilot"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hirepilot:change_me@db:5432/hirepilot
      UPLOAD_DIR: /app/data/uploads
      CHROMA_PERSIST_DIR: /app/data/chroma
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
  dashboard:
    build: ./frontend
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
volumes:
  postgres_data:
  app_data:
